<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Purple Buzz</title>
 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .hero-contact {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            padding: 70px 0;
        }
        .btn-purple {
            background-color: #6a11cb;
            color: white;
            border-radius: 8px;
            padding: 12px 25px;
        }
        .btn-purple:hover {
            background-color: #530ca8;
            color: white;
        }
        .contact-info-icon {
            width: 50px;
            height: 50px;
            background-color: #f0e6ff;
            color: #6a11cb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

  
    <section class="hero-contact text-center">
        <div class="container">
            <h1 class="display-4 fw-bold">Get In Touch</h1>
            <p class="lead">Have a project in mind or just want to say hi? Send us a message!</p>
        </div>
    </section>

    
    <section class="py-5">
        <div class="container py-4">
            <div class="row g-5">
                
                
                <div class="col-lg-5">
                    <h3 class="fw-bold mb-4">Contact Information</h3>
                    
                    <div class="d-flex align-items-center mb-4">
                        <div class="contact-info-icon me-3"><i class="fa-solid fa-location-dot"></i></div>
                        <div>
                            <h6 class="fw-bold mb-0">Address</h6>
                            <p class="text-muted mb-0">456 Creative Street, Digital City, IN</p>
                        </div>
                    </div>

                    <div class="d-flex align-items-center mb-4">
                        <div class="contact-info-icon me-3"><i class="fa-solid fa-envelope"></i></div>
                        <div>
                            <h6 class="fw-bold mb-0">Email Us</h6>
                            <p class="text-muted mb-0">support@purplebuzz.com</p>
                        </div>
                    </div>

                    <div class="d-flex align-items-center mb-4">
                        <div class="contact-info-icon me-3"><i class="fa-solid fa-phone"></i></div>
                        <div>
                            <h6 class="fw-bold mb-0">Call Us</h6>
                            <p class="text-muted mb-0">+91 XXXXX XXXXX </p>
                        </div>
                    </div>
                </div>

                
                <div class="col-lg-7">
                    <div class="card border-0 shadow-sm p-4 p-md-5 rounded-4">
                        <h3 class="fw-bold mb-4">Send a Message</h3>
                        <form>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Your Name</label>
                                    <input type="text" class="form-control form-control-lg bg-light border-0" placeholder="Vansh">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Your Email</label>
                                    <input type="email" class="form-control form-control-lg bg-light border-0" placeholder="vk2162005gmail.com">
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-semibold">Subject</label>
                                    <input type="text" class="form-control form-control-lg bg-light border-0" placeholder="Project Discussion">
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-semibold">Message</label>
                                    <textarea class="form-control form-control-lg bg-light border-0" rows="4" placeholder="Write your message here..."></textarea>
                                </div>
                                <div class="col-12 mt-4">
                                    <button type="submit" class="btn btn-purple w-100 fw-bold">Send Message</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </section>

</body>
</html>
